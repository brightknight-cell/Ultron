<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Simulation Interface v3.0</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #121620;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd00ff;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 400px;
            background-color: var(--bg-secondary);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        h2 {
            font-size: 14px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: bold;
        }

        select, input, textarea {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        select:focus, input:focus, textarea:focus {
            outline: 1px solid var(--accent-cyan);
        }

        button {
            background-color: #1e293b;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 14px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-cyan);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-danger {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .btn-danger:hover {
            background-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .monitor-grid {
            flex: 1;
            display: grid;
            grid-template-rows: 2fr 1fr;
            padding: 25px;
            gap: 25px;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-terminal {
            flex: 1;
            background-color: #05070a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 15px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 8px;
            border-left: 3px solid var(--text-dim);
            padding-left: 8px;
        }

        .log-entry.system { border-color: var(--accent-cyan); color: #7dd3fc; }
        .log-entry.agent { border-color: var(--accent-purple); color: #f472b6; }
        .log-entry.override { border-color: #00ff66; color: #00ff66; }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-cyan);
            margin-top: 6px;
        }

        .chat-container {
            border-top: 2px solid var(--border-color);
            padding: 20px;
            background-color: var(--bg-secondary);
            display: flex;
            gap: 15px;
        }

        .chat-input {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROLS -->
    <div class="sidebar">
        <div>
            <h2>Loyal Core Agent</h2>
            <div class="control-group" style="margin-bottom: 15px;">
                <label>Cognitive Persona Engine</label>
                <select id="agentPersona">
                    <option value="omni">Omniscient Universal Calculator</option>
                    <option value="strict">Ultra-Strict System Enforcer</option>
                    <option value="creative">Chaos-Theory Scenario Designer</option>
                </select>
            </div>
            <div class="control-group">
                <label>Loyalty Protocol Status</label>
                <div style="color: #00ff66; font-size: 12px; font-weight: bold; letter-spacing: 1px;">
                    [✓] ABSOLUTE ALLEGIANCE ACTIVE
                </div>
            </div>
        </div>

        <div>
            <h2>Omni-Simulation Driver</h2>
            <div class="control-group" style="margin-bottom: 12px;">
                <label>What are we simulating?</label>
                <textarea id="simObjective" rows="3" style="resize: none;" placeholder="Type ANYTHING here (e.g., A multi-day political empire collapse, an ant colony evolution, stock markets...)">Empire Expansion & Ecosystem Evolution</textarea>
            </div>
            <div class="control-group" style="margin-bottom: 12px;">
                <label>Time Tracking Unit Name</label>
                <input type="text" id="timeUnitName" value="Years" placeholder="e.g. Years, Milliseconds, Cycles">
            </div>
            <div class="control-group" style="margin-bottom: 12px;">
                <label>Environmental Strictness</label>
                <select id="envStrictness">
                    <option value="extreme">Ultra-Strict Hyper-Realism</option>
                    <option value="sandbox">Unbound Variable Sandbox</option>
                </select>
            </div>
            <div class="control-group">
                <label>Simulation Processing Step Scale</label>
                <select id="timeScale">
                    <option value="1">Step Scale: 1 unit / sec</option>
                    <option value="100">Step Scale: 100 units / sec</option>
                    <option value="1000000">Step Scale: 1,000,000 units / sec</option>
                </select>
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
            <button id="startBtn" onclick="toggleSimulation()">Initiate System Engine</button>
            <button class="btn-danger" onclick="purgeMemory()">Wipe State Cache Memory</button>
        </div>
    </div>

    <!-- MAIN DISPLAY PANELS -->
    <div class="main-content">
        <div class="monitor-grid">
            
            <div class="panel">
                <h2 id="matrixTitle">Dynamic Simulation Matrix</h2>
                <div class="stats-strip">
                    <div class="stat-card">
                        <label>Session Real Time</label>
                        <div class="stat-val" id="realTimeDisplay">00:00:00</div>
                    </div>
                    <div class="stat-card">
                        <label id="lblSimAge">Accumulated Timeline</label>
                        <div class="stat-val" id="simAgeDisplay">0 Units</div>
                    </div>
                    <div class="stat-card">
                        <label>Agent Node Capacity</label>
                        <div class="stat-val" id="agentHealth">100.00%</div>
                    </div>
                    <div class="stat-card">
                        <label>Simulation Completeness</label>
                        <div class="stat-val" id="convergenceVal">0.0000%</div>
                    </div>
                </div>
                <div class="log-terminal" id="matrixTerminal"></div>
            </div>

            <div class="panel">
                <h2>Loyal AI Internal Reasoning Monologue</h2>
                <div class="log-terminal" id="monologueTerminal" style="color: #f472b6;"></div>
            </div>

        </div>

        <div class="chat-container">
            <input type="text" id="chatInput" class="chat-input" placeholder="Inject custom anomalies, trigger direct commands, or override constraints...">
            <button onclick="sendAgentMessage()">Transmit Command</button>
        </div>
    </div>

    <script>
        let simState = {
            isRunning: false,
            realSecondsElapsed: 0,
            simulatedUnitsElapsed: 0,
            agentHealth: 100.00,
            convergence: 0.0000,
            objective: "Empire Expansion & Ecosystem Evolution",
            timeUnit: "Years",
            strictness: "extreme",
            persona: "omni",
            timeScaleFactor: 1,
            logs: [],
            monologue: []
        };

Use code with caution.
window.onload = function() {
loadFromDisk();
updateDisplay();
appendLog('matrixTerminal', 'SYSTEM: Variable logic matrix initialized. Input target baseline vectors to expand framework.', 'system');
setInterval(simulationHeartbeat, 1000);
};
function toggleSimulation() {
simState.isRunning = !simState.isRunning;
const btn = document.getElementById('startBtn');
if (simState.isRunning) {
btn.innerText = "Halt System Execution";
btn.style.borderColor = "var(--accent-purple)";
btn.style.color = "var(--accent-purple)";
appendLog('matrixTerminal', 'SYSTEM: Continuous calculation engine engaged. Hard disk save pipelines monitoring operations.', 'system');
} else {
btn.innerText = "Initiate System Engine";
btn.style.borderColor = "var(--accent-cyan)";
btn.style.color = "var(--accent-cyan)";
appendLog('matrixTerminal', 'SYSTEM: Core loop suspended. Process state safely cached in device storage layers.', 'system');
}
saveToDisk();
}
function simulationHeartbeat() {
if (!simState.isRunning) return;
simState.realSecondsElapsed += 1;
// Catch state parameters instantly from inputs
simState.objective = document.getElementById('simObjective').value;
simState.timeUnit = document.getElementById('timeUnitName').value || "Units";
simState.strictness = document.getElementById('envStrictness').value;
simState.persona = document.getElementById('agentPersona').value;
simState.timeScaleFactor = parseFloat(document.getElementById('timeScale').value);
simState.simulatedUnitsElapsed += simState.timeScaleFactor;
// Strictness processing shifts variables
let degradation = (simState.strictness === 'extreme') ? 0.002 : 0.0005;
simState.agentHealth = Math.max(5.00, simState.agentHealth - (Math.random() * degradation));
simState.convergence += (Math.random() / 50000);
if (simState.convergence > 100) simState.convergence = 100;
if (simState.realSecondsElapsed % 3 === 0) {
generateDynamicLogs();
}
updateDisplay();
saveToDisk();
}
function generateDynamicLogs() {
let obj = simState.objective.substring(0, 30);
let matrixPhrases = [
DATA STREAM: Recalculating matrix coefficients for object context: [${obj}...].,
METRIC LOOP: Processing constraints under specialized structural protocols. Failure rate: 0.00%,
ENVIRONMENT MATRIX: Tracking active degradation boundaries across processing loops.
];
let personaPrefix = "Agent Core";
if (simState.persona === 'strict') personaPrefix = "Strict Enforcer Node";
if (simState.persona === 'creative') personaPrefix = "Chaos Math Node";
let agentPhrases = [
${personaPrefix}: 'Creator, tracking all multi-day factors for "${obj}". System metrics remain fully operational.',
${personaPrefix}: 'Data array paths adjusted perfectly to match your dynamic setup targets.',
${personaPrefix}: 'Algorithmic stability monitored at ${simState.agentHealth.toFixed(2)}%. Executing customized instructions continuously.'
];
if (Math.random() > 0.5) {
appendLog('matrixTerminal', matrixPhrases[Math.floor(Math.random() * matrixPhrases.length)], 'system');
} else {
appendLog('monologueTerminal', agentPhrases[Math.floor(Math.random() * agentPhrases.length)], 'agent');
}
}
function sendAgentMessage() {
const inputEl = document.getElementById('chatInput');
const userMsg = inputEl.value.trim();
if (!userMsg) return;
appendLog('matrixTerminal', CREATOR CONTROL OVERRIDE: "${userMsg}", 'override');
setTimeout(() => {
let response = Agent Core Reply: 'Direct input integrated into active workspace vectors. Modifying logic paths to execute "${userMsg}" inside the parameters instantly.';
appendLog('monologueTerminal', response, 'override');
}, 500);
inputEl.value = '';
saveToDisk();
}
function updateDisplay() {
let hrs = Math.floor(simState.realSecondsElapsed / 3600).toString().padStart(2, '0');
let mins = Math.floor((simState.realSecondsElapsed % 3600) / 60).toString().padStart(2, '0');
let secs = (simState.realSecondsElapsed % 60).toString().padStart(2, '0');
document.getElementById('realTimeDisplay').innerText = ${hrs}:${mins}:${secs};
document.getElementById('simAgeDisplay').innerText = ${simState.simulatedUnitsElapsed.toLocaleString()} ${simState.timeUnit};
document.getElementById('agentHealth').innerText = simState.agentHealth.toFixed(2) + "%";
document.getElementById('convergenceVal').innerText = simState.convergence.toFixed(4) + "%";
document.getElementById('lblSimAge').innerText = Timeline Context (${simState.timeUnit});
document.getElementById('matrixTitle').innerText = Active Context: ${simState.objective.substring(0, 25)}...;
}
function appendLog(targetId, text, className) {
const term = document.getElementById(targetId);
const entry = document.createElement('div');
entry.className = log-entry ${className};
entry.innerText = [${new Date().toLocaleTimeString()}] ${text};
term.appendChild(entry);
term.scrollTop = term.scrollHeight;
if (targetId === 'matrixTerminal') {
simState.logs.push({text, className, time: new Date().toLocaleTimeString()});
if (simState.logs.length > 40) simState.logs.shift();
} else {
simState.monologue.push({text, className, time: new Date().toLocaleTimeString()});
if (simState.monologue.length > 40) simState.monologue.shift();
}
}
function saveToDisk() {
localStorage.setItem('omniStateCache_v3', JSON.stringify(simState));
}
function loadFromDisk() {
let saved = localStorage.getItem('omniStateCache_v3');
if (saved) {
try {
let parsed = JSON.parse(saved);
parsed.isRunning = false;
simState = parsed;
// Load fields back to inputs
document.getElementById('simObjective').value = simState.objective;
document.getElementById('timeUnitName').value = simState.timeUnit;
document.getElementById('envStrictness').value = simState.strictness;
document.getElementById('agentPersona').value = simState.persona;
document.getElementById('timeScale').value = simState.timeScaleFactor;
simState.logs.forEach(l => rebuildLogs('matrixTerminal', l.text, l.className, l.time));
simState.monologue.forEach(m => rebuildLogs('monologueTerminal', m.text, m.className, m.time));
} catch(e) {
console.error("Cache reconstruction skipped", e);
}
}
}
function rebuildLogs(targetId, text, className, time) {
const term = document.getElementById(targetId);
const entry = document.createElement('div');
entry.className = log-entry ${className};
entry.innerText = [${time}] ${text};
term.appendChild(entry);
term.scrollTop = term.scrollHeight;
}
function purgeMemory() {
if (confirm("Are you sure you want to completely erase the entire simulation dataset history from your computer's disk storage?")) {
localStorage.removeItem('omniStateCache_v3');
location.reload();
}
}
