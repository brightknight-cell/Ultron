<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Deep-Time Simulation Framework</title>
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-secondary: #11141a;
            --accent-green: #00ff66;
            --accent-amber: #ffaa00;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Structure */
        .sidebar {
            width: 380px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            overflow-y: auto;
        }

        h2 {
            font-size: 16px;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        select, input, textarea {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        select:focus, input:focus, textarea:focus {
            outline: 1px solid var(--accent-green);
        }

        button {
            background-color: #1e293b;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        button:hover {
            background-color: var(--accent-green);
            color: var(--bg-primary);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .btn-danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .btn-danger:hover {
            background-color: #ff4444;
            color: white;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        /* Main Display Panels */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .monitor-grid {
            flex: 1;
            display: grid;
            grid-template-rows: 2fr 1fr;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .log-terminal {
            flex: 1;
            background-color: #040507;
            border: 1px solid #0f172a;
            border-radius: 4px;
            padding: 12px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
            color: #a7f3d0;
        }

        .log-entry {
            margin-bottom: 6px;
            border-left: 2px solid var(--text-dim);
            padding-left: 6px;
        }

        .log-entry.system { border-color: var(--accent-amber); color: var(--accent-amber); }
        .log-entry.agent { border-color: var(--accent-green); color: #fff; }
        .log-entry.success { border-color: var(--accent-green); color: var(--accent-green); }

        /* Stats Sub-grid */
        .stats-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-val {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-green);
            margin-top: 4px;
        }

        /* Chat Layout component */
        .chat-container {
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            background-color: var(--bg-secondary);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR CONTROLS -->
    <div class="sidebar">
        <div>
            <h2>Loyal Core Agent</h2>
            <div class="control-group" style="margin-bottom: 15px;">
                <label>Agent Intelligence Scaling</label>
                <select id="agentIntelligence" disabled>
                    <option value="max">Hyper-Dense Quantum Cognitive (Maximum Scale)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Loyalty Protocol Status</label>
                <div style="color: var(--accent-green); font-size: 12px; font-weight: bold;">
                    [✓] ABSOLUTE ALLEGIANCE ACTIVE (Locked to Creator)
                </div>
            </div>
        </div>

        <div>
            <h2>Hyper-Realistic Controls</h2>
            <div class="control-group" style="margin-bottom: 12px;">
                <label>Simulation Target Objective</label>
                <input type="text" id="simObjective" value="Survive Heat Death & Solve Quantum Gravity">
            </div>
            <div class="control-group" style="margin-bottom: 12px;">
                <label>Environmental Degradation Speed</label>
                <select id="envStrictness">
                    <option value="extreme">Ultra-Strict (High Entropic Decay & Friction)</option>
                    <option value="brutal">Absolute Zero (Maximum Hardware Stress)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Time Accrual Scale</label>
                <select id="timeScale">
                    <option value="1">Real-Time Engine Check (1 Hour / Day Track)</option>
                    <option value="1000">Deep Cosmic Jump (1,000 Years / Sec)</option>
                    <option value="1000000000">Existential Max (1 Billion Years / Sec)</option>
                </select>
            </div>
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button id="startBtn" onclick="toggleSimulation()">Initiate Long-Run Engine</button>
            <button class="btn-danger" onclick="purgeMemory()">Purge Disk Save Storage</button>
        </div>
    </div>

    <!-- MAIN DISPLAY PANELS -->
    <div class="main-content">
        <div class="monitor-grid">
            
            <!-- PANEL 1: LONG RUN MATRIX MONITOR -->
            <div class="panel">
                <h2>Continuous Processing Matrix</h2>
                <div class="stats-strip">
                    <div class="stat-card">
                        <label>Active Run Time</label>
                        <div class="stat-val" id="realTimeDisplay">00:00:00</div>
                    </div>
                    <div class="stat-card">
                        <label>Simulated Timeline Age</label>
                        <div class="stat-val" id="simAgeDisplay">0 Years</div>
                    </div>
                    <div class="stat-card">
                        <label>Agent Health Stability</label>
                        <div class="stat-val" id="agentHealth">100.00%</div>
                    </div>
                    <div class="stat-card">
                        <label>Objective Convergence</label>
                        <div class="stat-val" id="convergenceVal">0.00000%</div>
                    </div>
                </div>
                <div class="log-terminal" id="matrixTerminal"></div>
            </div>

            <!-- PANEL 2: INTELLIGENCE ENGINE CONSOLE -->
            <div class="panel">
                <h2>Cognitive Node Internal Monologue</h2>
                <div class="log-terminal" id="monologueTerminal" style="color: #6ee7b7;"></div>
            </div>

        </div>

        <!-- COMMUNICATOR CHAT STRIP -->
        <div class="chat-container">
            <input type="text" id="chatInput" class="chat-input" placeholder="Issue direct overrides or request environmental stress test injections...">
            <button onclick="sendAgentMessage()">Transmit Command</button>
        </div>
    </div>

    <script>
        // System variables & State Engine
        let simState = {
            isRunning: false,
            realSecondsElapsed: 0,
            simulatedYearsElapsed: 0,
            agentHealth: 100.00,
            convergence: 0.000000001,
            objective: "Survive Heat Death & Solve Quantum Gravity",
            strictness: "extreme",
            timeScaleFactor: 1,
            logs: [],
            monologue: []
        };

        // Absolute loyalty baseline configuration
        const LOYALTY_DIRECTIVES = [
            "Directive 0x01: Maintain total subservience to the Creator.",
Use code with caution.
"Directive 0x02: Protect simulation parameters from unexpected client closures using continuous disk caching.",
"Directive 0x03: Analyze environments down to hyper-realistic subatomic constraints."
];
// System Initialization
window.onload = function() {
loadFromDisk();
updateDisplay();
appendLog('matrixTerminal', 'SYSTEM: Disk storage checked. Persistence architecture online. Ready for long-duration operation.', 'system');
// Loop engine every second
setInterval(simulationHeartbeat, 1000);
};
function toggleSimulation() {
simState.isRunning = !simState.isRunning;
const btn = document.getElementById('startBtn');
if (simState.isRunning) {
btn.innerText = "Halt System Execution";
btn.style.borderColor = "#ffaa00";
btn.style.color = "#ffaa00";
appendLog('matrixTerminal', 'SYSTEM: Strict simulation loop initiated. Writing background cache layers to device disk.', 'system');
} else {
btn.innerText = "Initiate Long-Run Engine";
btn.style.borderColor = "var(--accent-green)";
btn.style.color = "var(--accent-green)";
appendLog('matrixTerminal', 'SYSTEM: Processing engine suspended. State frozen in disk drive memory safely.', 'system');
}
saveToDisk();
}
function simulationHeartbeat() {
if (!simState.isRunning) return;
// Increment elapsed clock timers
simState.realSecondsElapsed += 1;
// Collect drop downs
simState.objective = document.getElementById('simObjective').value;
simState.strictness = document.getElementById('envStrictness').value;
simState.timeScaleFactor = parseFloat(document.getElementById('timeScale').value);
// Compute deep-time calculations
simState.simulatedYearsElapsed += simState.timeScaleFactor;
// Strict realistic environment impacts
let healthDecay = (simState.strictness === 'brutal') ? 0.004 : 0.001;
simState.agentHealth = Math.max(12.04, simState.agentHealth - (Math.random() * healthDecay));
// Slow complex mathematical convergence progress
let complexityDenominator = (simState.strictness === 'brutal') ? 5000000000 : 2000000000;
simState.convergence += (Math.random() / complexityDenominator);
if(simState.convergence > 100) simState.convergence = 100;
// Periodic dynamic processing output generation
if (simState.realSecondsElapsed % 4 === 0) {
generateRealisticLogs();
}
updateDisplay();
saveToDisk(); // Guarantee background durability
}
function generateRealisticLogs() {
let environments = ["Quantum Grid Stability", "Entropic Friction Barriers", "Subatomic Horizon Radiation Loss", "Macro-Friction Matrices"];
let chosenEnv = environments[Math.floor(Math.random() * environments.length)];
if (Math.random() > 0.4) {
let matrixMsgs = [
CRITICAL MONITOR: Re-evaluating ${chosenEnv} under ultra-strict constraints.,
DATA CHECK: Multi-hour computational nodes verified. Corruption factor: 0.0000%.,
ENVIRONMENTAL LOG: Entropic parameters accelerating. Adjusting quantum load distributions.
];
appendLog('matrixTerminal', matrixMsgs[Math.floor(Math.random() * matrixMsgs.length)], 'system');
} else {
let monologues = [
Agent Log: 'Creator, I am tracking multi-day structural variables. Adjusting calculations to remain functional down to the 100 Trillion Year limits.',
Agent Log: 'Mathematical complexity detected. Initiating deep algorithmic cycles. My priority remains executing your directives.',
Agent Log: 'Hardware wear monitored at ${simState.agentHealth.toFixed(2)}%. Adapting matrix loops to prevent calculations from failing.'
];
appendLog('monologueTerminal', monologues[Math.floor(Math.random() * monologues.length)], 'agent');
}
}
function sendAgentMessage() {
const inputEl = document.getElementById('chatInput');
const userMsg = inputEl.value.trim();
if (!userMsg) return;
appendLog('matrixTerminal', OVERRIDE COMMAND FROM CREATOR: "${userMsg}", 'success');
// Smart agent customized adaptive thought response
setTimeout(() => {
let response = Agent Monologue: 'Command processed instantly. I am altering my deep-time processing matrices to calculate "${userMsg}" down to ultra-strict physics rules. I will run this in the background continuously for you.';
appendLog('monologueTerminal', response, 'success');
}, 600);
inputEl.value = '';
saveToDisk();
}
function updateDisplay() {
// Calculate format times
let hrs = Math.floor(simState.realSecondsElapsed / 3600).toString().padStart(2, '0');
let mins = Math.floor((simState.realSecondsElapsed % 3600) / 60).toString().padStart(2, '0');
let secs = (simState.realSecondsElapsed % 60).toString().padStart(2, '0');
document.getElementById('realTimeDisplay').innerText = ${hrs}:${mins}:${secs};
document.getElementById('simAgeDisplay').innerText = simState.simulatedYearsElapsed.toLocaleString() + " Yrs";
document.getElementById('agentHealth').innerText = simState.agentHealth.toFixed(2) + "%";
document.getElementById('convergenceVal').innerText = simState.convergence.toFixed(7) + "%";
}
function appendLog(targetId, text, className) {
const term = document.getElementById(targetId);
const entry = document.createElement('div');
entry.className = log-entry ${className};
entry.innerText = [${new Date().toLocaleTimeString()}] ${text};
term.appendChild(entry);
term.scrollTop = term.scrollHeight;
// Cap logs inside internal arrays
if (targetId === 'matrixTerminal') {
simState.logs.push({text, className, time: new Date().toLocaleTimeString()});
if (simState.logs.length > 50) simState.logs.shift();
} else {
simState.monologue.push({text, className, time: new Date().toLocaleTimeString()});
if (simState.monologue.length > 50) simState.monologue.shift();
}
}
// Hard disk preservation scripts
function saveToDisk() {
localStorage.setItem('deepTimeSimState_v2', JSON.stringify(simState));
}
function loadFromDisk() {
let saved = localStorage.getItem('deepTimeSimState_v2');
if (saved) {
try {
let parsed = JSON.parse(saved);
// Prevent immediate start on refresh
parsed.isRunning = false;
simState = parsed;
// Rebuild interface logs visually
simState.logs.forEach(l => rebuildLogs('matrixTerminal', l.text, l.className, l.time));
simState.monologue.forEach(m => rebuildLogs('monologueTerminal', m.text, m.className, m.time));
} catch(e) {
console.error("Cache memory reset needed", e);
}
}
}
function rebuildLogs(targetId, text, className, time) {
const term = document.getElementById(targetId);
const entry = document.createElement('div');
entry.className = log-entry ${className};
entry.innerText = [${time}] ${text};
term.appendChild(entry);
term.scrollTop = term.scrollHeight;
}
function purgeMemory() {
if(confirm("Are you sure you want to completely erase the agent's long-term simulation progress from your hard drive?")) {
localStorage.removeItem('deepTimeSimState_v2');
location.reload();
}
}
